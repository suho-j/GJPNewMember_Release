<html>
<head>
    <meta charset='utf-8'>
    <style>
        body { font-family: Segoe UI, sans-serif; padding: 20px; font-size: 14px; }
        h2 { border-bottom: 1px solid #ccc; padding-bottom: 10px; font-size: 18px; }
        ul { list-style-type: none; padding: 0; }
        li { margin-bottom: 8px; padding: 8px; background: #f9f9f9; border-radius: 5px; font-size: 13px; }
        b { color: #0078d4; }
    </style>
</head>
<body>
    <h2>업데이트 안내 (1.0.47)</h2>
    <h3>인쇄 양식 개선</h3>
<ul>
    <li>도우미용 등록명단의 ‘가족’ 항목을 ‘비고’로 변경해 등록된 비고 내용을 출력합니다.</li>
    <li>등록사진에 등록된 가족의 이름과 전화번호를 자동으로 표시합니다. 본인을 제외하고 최대 6명까지, 좌우 2열에 3명씩 출력합니다.</li>
    <li>가족이 3명 이하이면 왼쪽 열만 사용하며, 전화번호가 없으면 이름만 표시합니다.</li>
</ul>

</body>
</html>
